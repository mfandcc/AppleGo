<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E5C68"/>
      <stop offset="55%" stop-color="#55707E"/>
      <stop offset="100%" stop-color="#8FA4B0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#14242C" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 圆角方底,和应用底色同一条渐变 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- 盾:对应中控台左上角的品牌标 -->
  <g filter="url(#soft)">
    <path d="M512 196 L760 296 V556 c0 150 -104 262 -248 300 c-144 -38 -248 -150 -248 -300 V296 Z"
          fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linejoin="round"/>
    <!-- 勾:用"就绪"的那支绿 -->
    <path d="M404 540 L482 618 L632 452" fill="none" stroke="#6AFF91" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 三个小点:多开 -->
  <g fill="#FFFFFF" opacity=".92">
    <circle cx="404" cy="742" r="22"/>
    <circle cx="512" cy="742" r="22"/>
    <circle cx="620" cy="742" r="22"/>
  </g>
</svg>
